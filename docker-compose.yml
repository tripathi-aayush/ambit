services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ambit
      POSTGRES_PASSWORD: ambit
      POSTGRES_DB: ambit
    ports:
      - "5433:5432"
    volumes:
      - ambit_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambit"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.0.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./infra/opa/policies:/policies
    ports:
      - "8181:8181"

  core:
    build: ./services/core
    env_file:
      - ./services/core/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ambit:ambit@postgres:5432/ambit
      OPA_URL: http://opa:8181
      REPOS_DIR: /data/repos
      PLANS_DIR: /plans
    volumes:
      - ambit_repos_data:/data/repos
      # Same host directory the sandbox service bind-mounts below -- core
      # writes plan clones here, and the sandbox's runner.py needs to see
      # the exact same files under its own /plans to copy them into a test
      # container. Must be this literal host path on both sides, not two
      # separate named volumes (those wouldn't share content).
      - ./services/core/.data/plans:/plans
      # core invokes `docker exec` into the sandbox container (see
      # app/executor.py) -- needs the host daemon's socket, since it has no
      # daemon of its own (unlike sandbox, which is deliberately
      # --privileged with a real nested one for isolation).
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started

  sandbox:
    build: ./infra/sandbox
    privileged: true
    volumes:
      - ambit_sandbox_docker:/var/lib/docker
      # Bind (not named volume): must be the identical host path core's
      # own /plans mount above resolves to -- see that comment. Nested DinD
      # resolves `docker run -v` source paths against this container's own
      # filesystem, which is why this must be a real bind mount and not a
      # named volume the inner daemon can't see into (see runner.py for
      # why --workspace uses docker cp rather than a live mount at all).
      - ./services/core/.data/plans:/plans

volumes:
  ambit_pgdata:
  ambit_sandbox_docker:
  ambit_repos_data:
